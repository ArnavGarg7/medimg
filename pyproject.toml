[project]
name = "medimg"
version = "0.2.0"
description = "Medical imaging triage and lesion analysis workstation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "scipy>=1.12",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "torchvision>=0.17"]
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]
ui = ["gradio>=5.0"]
dev = [
    "pytest>=8",
    "scikit-learn>=1.3",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "gradio>=5.0",
]
all = [
    "torch>=2.2",
    "torchvision>=0.17",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "gradio>=5.0",
    "pytest>=8",
    "scikit-learn>=1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
